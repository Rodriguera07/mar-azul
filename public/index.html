<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Trailer Mar Azul</title>

    <!-- PWA (theme-color e favicon vêm de app.json > web, injetados automaticamente pelo Expo) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="background-color" content="#F3F6FB" />

    <!-- iOS: permite abrir em tela cheia a partir da tela de início -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mar Azul" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Outros navegadores com suporte a PWA (Android/Chrome) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Evita que números (ex.: valores/telas de relatório) virem links de telefone no iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #F3F6FB;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        touch-action: manipulation;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Você precisa habilitar o JavaScript para executar este aplicativo.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!--
      Rede de segurança de abertura: se o aplicativo não chegar a aparecer (ex.:
      um celular com navegador antigo que não entende alguma parte do código),
      mostra uma mensagem com o motivo e um botão para recarregar, em vez de
      deixar a tela branca. Some sozinho assim que o app desenha algo.
    -->
    <script>
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) {
          if (errors.length < 3) errors.push(String(e && e.message ? e.message : e));
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (errors.length < 3) errors.push(String(e && e.reason && e.reason.message ? e.reason.message : e.reason));
        });
        function appVisible() {
          var root = document.getElementById('root');
          return !!(root && root.childElementCount > 0 && root.innerText && root.innerText.trim().length > 0);
        }
        function show() {
          if (appVisible() || document.getElementById('boot-guard')) return;
          var box = document.createElement('div');
          box.id = 'boot-guard';
          box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:#F3F6FB;font-family:-apple-system,Helvetica,Arial,sans-serif;text-align:center;color:#0F1B33');
          var detail = errors.length ? errors.join(' | ').replace(/</g, '&lt;') : 'sem detalhes';
          box.innerHTML =
            '<div style="font-size:19px;font-weight:700;margin-bottom:8px">O aplicativo não abriu</div>' +
            '<div style="font-size:14px;line-height:1.5;color:#5B6B85;max-width:300px">Toque em Recarregar. Se continuar assim, feche o app por completo e abra de novo.</div>' +
            '<button id="boot-guard-btn" style="margin-top:20px;height:46px;padding:0 26px;border:0;border-radius:14px;background:#1565D8;color:#fff;font-size:15px;font-weight:600">Recarregar</button>' +
            '<div style="margin-top:22px;font-size:11px;line-height:1.4;color:#97A3B8;max-width:320px;word-break:break-word">Detalhe técnico: ' + detail + '</div>';
          document.body.appendChild(box);
          document.getElementById('boot-guard-btn').onclick = function () { window.location.reload(); };
        }
        // Dá tempo de internet lenta carregar; só então verifica se o app apareceu.
        setTimeout(show, 12000);
        window.addEventListener('error', function () { setTimeout(show, 4000); });
      })();
    </script>
  </body>
</html>
